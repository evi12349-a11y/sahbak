<!doctype html>
<html lang="he" dir="rtl" data-mode="practice">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>סחבק — תרגול מבחנים</title>
  <style>
    :root{--ink:#18323a;--muted:#63757b;--paper:#f7faf9;--card:#fff;--line:#d9e6e4;--brand:#087f83;--brand-dark:#075d62;--brand-soft:#e3f3f1;--ok:#19734d;--ok-soft:#e7f5ed;--danger:#ae3d46;--danger-soft:#fff0f0;--shadow:0 12px 35px rgba(26,60,65,.08)}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,"Noto Sans Hebrew",sans-serif;line-height:1.55}button{font:inherit;cursor:pointer}a{color:inherit}
    .topbar{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}.topbar-inner{max-width:1180px;margin:auto;padding:16px 24px;display:flex;align-items:center;gap:18px}.logo{font-weight:800;font-size:1.2rem;color:var(--brand-dark)}.logo span{display:inline-grid;place-items:center;background:var(--brand);color:white;border-radius:10px;width:34px;height:34px;margin-left:8px}.topbar nav{display:flex;gap:6px;margin-right:auto}.nav-link{padding:8px 12px;border-radius:8px;text-decoration:none;color:var(--muted)}.nav-link.active,.nav-link:hover{background:var(--brand-soft);color:var(--brand-dark)}
    .container{max-width:1180px;margin:auto;padding:34px 24px 70px}.hero{display:flex;justify-content:space-between;gap:24px;align-items:flex-end;margin-bottom:28px}.eyebrow{font-size:.8rem;color:var(--brand);font-weight:700;letter-spacing:.08em}.hero h1{font-size:clamp(1.8rem,4vw,3rem);margin:6px 0 8px;line-height:1.15}.hero p{color:var(--muted);margin:0;max-width:620px}.mock-note{background:#fff8df;border:1px solid #eadb9c;border-radius:12px;padding:12px 14px;max-width:285px;font-size:.82rem;color:#6c591d}.section-heading{display:flex;justify-content:space-between;align-items:baseline;gap:16px;margin:25px 0 12px}.section-heading h2{font-size:1.15rem;margin:0}.section-heading p{margin:0;color:var(--muted);font-size:.9rem}
    .year-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.year-card,.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.year-card{padding:18px;transition:.18s transform,.18s box-shadow}.year-card:hover,.year-card.selected{transform:translateY(-2px);box-shadow:0 16px 38px rgba(26,60,65,.13);border-color:#9ccac8}.year-card button{display:block;border:0;background:transparent;text-align:right;width:100%;padding:0;color:inherit}.year{font-size:1.65rem;font-weight:800}.year-meta{color:var(--muted);font-size:.88rem}.year-cta{color:var(--brand);font-weight:700;font-size:.88rem;margin-top:12px}
    .workspace{display:grid;grid-template-columns:270px minmax(0,1fr);gap:18px;margin-top:28px}.panel{padding:20px}.question-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.q-tab{width:40px;height:40px;border:1px solid var(--line);border-radius:9px;background:var(--paper);color:var(--muted);font-weight:700}.q-tab.active{background:var(--brand);border-color:var(--brand);color:white}.q-tab.answered{box-shadow:inset 0 -3px 0 var(--ok)}.side-title{font-weight:800}.side-meta{font-size:.88rem;color:var(--muted);margin:4px 0 20px}.mode-switch{display:grid;grid-template-columns:1fr 1fr;padding:4px;background:var(--paper);border-radius:10px;margin-top:18px}.mode-switch button{border:0;background:transparent;padding:8px;border-radius:7px;color:var(--muted)}.mode-switch button.active{background:var(--card);color:var(--brand-dark);box-shadow:0 2px 8px rgba(0,0,0,.08)}.timer{font-variant-numeric:tabular-nums;background:var(--brand-soft);color:var(--brand-dark);border-radius:10px;padding:10px 12px;font-weight:800;text-align:center;margin-top:16px}.timer.warning{background:#fff3df;color:#9a5b12}.timer.expired{background:var(--danger-soft);color:var(--danger)}
    .question-header{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;border-bottom:1px solid var(--line);padding-bottom:15px}.question-label{color:var(--brand);font-weight:700;font-size:.9rem}.question-header h2{font-size:1.3rem;margin:4px 0 0}.question-body{font-size:1.1rem;margin:24px 0 18px}.options{display:grid;gap:10px}.option{border:1px solid var(--line);background:var(--card);border-radius:11px;padding:13px 15px;text-align:right;display:flex;gap:10px;align-items:flex-start}.option:hover{border-color:var(--brand)}.option input{accent-color:var(--brand);margin-top:5px}.option.correct{border-color:var(--ok);background:var(--ok-soft)}.option.incorrect{border-color:var(--danger);background:var(--danger-soft)}.solution{margin-top:18px;padding:15px;border-radius:11px;background:var(--brand-soft);border-right:4px solid var(--brand)}.solution strong{display:block;margin-bottom:4px}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:24px}.btn{border:1px solid var(--line);border-radius:9px;padding:10px 15px;background:var(--card);color:var(--ink);font-weight:700}.btn.primary{background:var(--brand);border-color:var(--brand);color:white}.btn.primary:hover{background:var(--brand-dark)}.btn:disabled{opacity:.45;cursor:not-allowed}.result{margin-top:20px;padding:18px;border-radius:12px;background:var(--ok-soft);border:1px solid #b7dec8}.result h3{margin:0 0 4px}.result strong{font-size:1.8rem;color:var(--ok)}
    .hidden{display:none!important}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:760px){.topbar-inner{padding:12px 16px}.topbar nav{display:none}.container{padding:24px 14px 50px}.hero{display:block}.mock-note{margin-top:18px;max-width:none}.workspace{grid-template-columns:1fr}.workspace aside{order:2}.question-header h2{font-size:1.1rem}.question-body{font-size:1rem}.actions{position:sticky;bottom:0;background:var(--card);padding-top:12px}}
  </style>
</head>
<body>
  <header class="topbar"><div class="topbar-inner"><div class="logo"><span>ס</span>סחבק</div><nav><a class="nav-link active" href="/exams">תרגול מבחנים</a><a class="nav-link" href="/dashboard">הדשבורד שלי</a></nav></div></header>
  <main class="container">
    <section class="hero"><div><div class="eyebrow">מרחב למידה</div><h1>תרגול מבחנים לפי שנה</h1><p>בחרו מבחן, עברו בין השאלות, בדקו פתרונות בקצב שלכם או הפעילו סימולציה מלאה עם זמן וציון.</p></div><div class="mock-note"><strong>נתוני הדגמה</strong><br>השאלות בדף הן mock data עד שייקלטו קבצי ה־PDF הסרוקים. המבנה מוכן להחלפה בנתונים מפורסרים.</div></section>
    <section><div class="section-heading"><h2>המבחנים הזמינים</h2><p id="exam-count"></p></div><div class="year-grid" id="year-grid"></div></section>
    <section class="workspace hidden" id="workspace">
      <aside class="panel"><div class="side-title" id="selected-title"></div><div class="side-meta" id="selected-meta"></div><div class="mode-switch" role="group" aria-label="מצב תרגול"><button id="practice-mode" class="active" type="button">תרגול</button><button id="exam-mode" type="button">מבחן מלא</button></div><div class="timer hidden" id="timer" aria-live="polite"></div><div class="section-heading"><h2>שאלות</h2><p id="progress"></p></div><div class="question-list" id="question-list"></div></aside>
      <section class="panel" aria-live="polite"><div class="question-header"><div><div class="question-label" id="question-label"></div><h2 id="question-title"></h2></div><div id="question-points" class="question-label"></div></div><div class="question-body" id="question-body"></div><div class="options" id="options"></div><div class="solution hidden" id="solution"><strong>פתרון מוסבר</strong><span id="solution-text"></span></div><div class="result hidden" id="result"></div><div class="actions"><button class="btn" id="prev" type="button">← הקודמת</button><button class="btn primary" id="reveal" type="button">הצג פתרון</button><button class="btn primary hidden" id="submit" type="button">סיום ובדיקת ציון</button><button class="btn" id="next" type="button">הבאה →</button></div></section>
    </section>
  </main>
  <script>
    // MOCK DATA: replace this array with parsed PDF output once the extraction pipeline is defined.
    const MOCK_EXAMS = [
      {year:2024,title:"מבחן לדוגמה — מבוא למנהל עסקים",durationMinutes:12,questions:[
        {prompt:"מהי מטרת העל של תהליך תכנון אסטרטגי?",options:["להגדיל את מספר הישיבות","להגדיר כיוון, יעדים ודרך פעולה","להחליף את כל העובדים","לצמצם את זמן העבודה"],answer:1,solution:"תכנון אסטרטגי מחבר בין חזון, יעדים מדידים והפעולות שיובילו אליהם."},
        {prompt:"איזה מדד מתאר את שיעור הלקוחות שחזרו לרכוש?",options:["שיעור נטישה","שיעור המרה","שיעור שימור","עלות רכישה"],answer:2,solution:"שיעור שימור (Retention) מודד כמה לקוחות נשארו וחזרו לאורך זמן."},
        {prompt:"מהו יתרון מרכזי של פילוח קהל?",options:["מסר אחיד לכולם","התאמת הצעה לקבוצות עם צרכים דומים","ביטול מחקר שוק","הפחתת איכות השירות"],answer:1,solution:"פילוח מאפשר להתאים מסרים והצעות לקבוצות בעלות מאפיינים וצרכים דומים."}
      ]},
      {year:2023,title:"מבחן לדוגמה — מבוא למנהל עסקים",durationMinutes:10,questions:[
        {prompt:"מה מתאר KPI?",options:["מדד ביצוע מרכזי","מסמך משפטי","תקציב שנתי","סקר שביעות רצון בלבד"],answer:0,solution:"KPI הוא Key Performance Indicator — מדד שמאפשר לעקוב אחר ביצוע ביחס ליעד."},
        {prompt:"מהי נקודת האיזון?",options:["מקום שבו אין הכנסות","הרמה שבה ההכנסות מכסות את כלל העלויות","המחיר הנמוך ביותר","היעד השנתי"],answer:1,solution:"בנקודת האיזון אין רווח או הפסד: ההכנסות שוות לעלות הקבועה והמשתנה."}
      ]}
    ];
    const $ = id => document.getElementById(id);
    let selectedExam = null, questionIndex = 0, mode = "practice", answers = [], revealed = false, timerId = null, secondsLeft = 0;
    function renderYears(){ $("exam-count").textContent = `${MOCK_EXAMS.length} מבחנים · נתוני הדגמה`; $("year-grid").innerHTML = MOCK_EXAMS.map((exam,i)=>`<article class="year-card ${selectedExam===i?"selected":""}"><button type="button" onclick="selectExam(${i})"><div class="year">${exam.year}</div><div class="year-meta">${exam.title}</div><div class="year-meta">${exam.questions.length} שאלות · ${exam.durationMinutes} דקות</div><div class="year-cta">פתיחת המבחן →</div></button></article>`).join(""); }
    function selectExam(index){stopTimer(); selectedExam=index; questionIndex=0; mode="practice"; answers=Array(MOCK_EXAMS[index].questions.length).fill(null); $("workspace").classList.remove("hidden"); setMode("practice"); renderYears(); renderQuestion(); $("workspace").scrollIntoView({behavior:"smooth",block:"start"});}
    function setMode(next){ mode=next; $("practice-mode").classList.toggle("active",mode==="practice"); $("exam-mode").classList.toggle("active",mode==="exam"); $("reveal").classList.toggle("hidden",mode!=="practice"); $("submit").classList.toggle("hidden",mode!=="exam"); $("submit").disabled=false; $("solution").classList.add("hidden"); $("result").classList.add("hidden"); $("timer").classList.toggle("hidden",mode!=="exam"); if(mode==="exam"){startTimer();}else{stopTimer();} renderQuestion(); }
    function renderQuestion(){ const exam=MOCK_EXAMS[selectedExam], q=exam.questions[questionIndex]; if(!q)return; revealed=false; $("selected-title").textContent=exam.title; $("selected-meta").textContent=`${exam.year} · ${exam.questions.length} שאלות`; $("question-label").textContent=`שאלה ${questionIndex+1} מתוך ${exam.questions.length}`; $("question-title").textContent=q.prompt; $("question-points").textContent="10 נקודות"; $("question-body").textContent=mode==="exam"?"בחרו תשובה אחת. הפתרון יופיע לאחר סיום המבחן.":"בחרו תשובה אחת, ואז הציגו את הפתרון כדי לבדוק את עצמכם."; $("options").innerHTML=q.options.map((option,i)=>`<label class="option" data-option="${i}"><input type="radio" name="answer" value="${i}" ${answers[questionIndex]===i?"checked":""} onchange="chooseAnswer(${i})"><span>${option}</span></label>`).join(""); $("question-list").innerHTML=exam.questions.map((_,i)=>`<button type="button" class="q-tab ${i===questionIndex?"active":""} ${answers[i]!==null?"answered":""}" onclick="goTo(${i})" aria-label="שאלה ${i+1}">${i+1}</button>`).join(""); $("progress").textContent=`${answers.filter(a=>a!==null).length}/${exam.questions.length} נענו`; $("prev").disabled=questionIndex===0; $("next").disabled=questionIndex===exam.questions.length-1; if(mode==="exam")$("timer").classList.remove("warning","expired"); }
    function chooseAnswer(value){answers[questionIndex]=Number(value); renderQuestion();} function goTo(i){questionIndex=i;renderQuestion()} function next(){if(questionIndex<MOCK_EXAMS[selectedExam].questions.length-1){questionIndex++;renderQuestion()}} function previous(){if(questionIndex>0){questionIndex--;renderQuestion()}}
    function revealSolution(){const q=MOCK_EXAMS[selectedExam].questions[questionIndex]; revealed=true; $("solution-text").textContent=q.solution; $("solution").classList.remove("hidden"); document.querySelectorAll(".option").forEach((el,i)=>{if(i===q.answer)el.classList.add("correct");else if(answers[questionIndex]===i)el.classList.add("incorrect")});}
    function startTimer(){stopTimer();secondsLeft=MOCK_EXAMS[selectedExam].durationMinutes*60;updateTimer();timerId=setInterval(()=>{secondsLeft--;updateTimer();if(secondsLeft<=0){stopTimer();finishExam(true)}},1000)} function stopTimer(){if(timerId){clearInterval(timerId);timerId=null}} function updateTimer(){const el=$("timer");el.textContent=`זמן שנותר: ${Math.floor(secondsLeft/60).toString().padStart(2,"0")}:${(secondsLeft%60).toString().padStart(2,"0")}`;el.classList.toggle("warning",secondsLeft<=60&&secondsLeft>0);el.classList.toggle("expired",secondsLeft<=0)}
    function finishExam(expired=false){stopTimer();const exam=MOCK_EXAMS[selectedExam],score=answers.reduce((total,a,i)=>total+(a===exam.questions[i].answer?1:0),0),pct=Math.round(score/exam.questions.length*100);$("result").innerHTML=`<h3>${expired?"הזמן הסתיים":"המבחן הושלם"} 🎉</h3><strong>${pct}%</strong><div>${score} מתוך ${exam.questions.length} תשובות נכונות</div>`;$("result").classList.remove("hidden");$("submit").disabled=true; $("next").disabled=true}
    $("practice-mode").onclick=()=>setMode("practice");$("exam-mode").onclick=()=>setMode("exam");$("reveal").onclick=revealSolution;$("submit").onclick=()=>finishExam();$("next").onclick=next;$("prev").onclick=previous;renderYears();
  </script>
</body>
</html>
