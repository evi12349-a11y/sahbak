<!DOCTYPE html>
<html lang="he" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>סחבק — לוח בקרה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root,[data-theme="light"]{
  --bg:#f7f6f2;--surface:#ffffff;--surface-2:#f9f8f5;--surface-off:#f0ede8;--surface-dyn:#e6e3de;
  --border:rgba(40,37,29,.12);--divider:rgba(40,37,29,.07);
  --text:#28251d;--muted:#7a7974;--faint:#bab9b4;
  --primary:#01696f;--primary-h:#0c4e54;--primary-hl:rgba(1,105,111,.12);
  --success:#437a22;--success-hl:rgba(67,122,34,.12);
  --error:#a12c7b;--error-hl:rgba(161,44,123,.12);
  --warn:#964219;--warn-hl:rgba(150,66,25,.12);
  --gold:#d19900;
  --sh-sm:0 1px 3px rgba(40,37,29,.07);--sh-md:0 4px 16px rgba(40,37,29,.1);--sh-lg:0 12px 36px rgba(40,37,29,.14);
}
[data-theme="dark"]{
  --bg:#111110;--surface:#1a1917;--surface-2:#1f1e1c;--surface-off:#252422;--surface-dyn:#2d2b28;
  --border:rgba(255,255,255,.09);--divider:rgba(255,255,255,.05);
  --text:#d4d3d0;--muted:#787775;--faint:#4e4d4b;
  --primary:#4f98a3;--primary-h:#227f8b;--primary-hl:rgba(79,152,163,.15);
  --success:#6daa45;--success-hl:rgba(109,170,69,.12);
  --error:#d163a7;--error-hl:rgba(209,99,167,.12);
  --warn:#bb653b;--warn-hl:rgba(187,101,59,.12);
  --gold:#e8af34;
  --sh-sm:0 1px 3px rgba(0,0,0,.25);--sh-md:0 4px 16px rgba(0,0,0,.35);--sh-lg:0 12px 36px rgba(0,0,0,.45);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased;scroll-behavior:smooth}
body{font-family:'Heebo',sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;font-size:1rem;line-height:1.6;padding-bottom:80px}
button{cursor:pointer;border:none;background:none;font:inherit;color:inherit}
input,select{font:inherit;color:var(--text)}

.hdr{background:var(--surface);border-bottom:1px solid var(--border);padding:.75rem 1.5rem;display:flex;align-items:center;gap:.875rem;position:sticky;top:0;z-index:100;box-shadow:var(--sh-sm);}
.logo{display:flex;align-items:center;gap:.5rem;font-size:1.1rem;font-weight:800;letter-spacing:-.02em}
.logo-icon{width:32px;height:32px;background:var(--primary);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:1rem}
.spacer{flex:1}
.badge{display:flex;align-items:center;gap:.375rem;font-size:.78rem;color:var(--muted);background:var(--surface-off);padding:.3rem .7rem;border-radius:999px;border:1px solid var(--border);}
.badge .dot{width:7px;height:7px;border-radius:50%;background:var(--faint);flex-shrink:0;transition:background .3s}
.badge.ok .dot{background:var(--success);box-shadow:0 0 0 2px var(--success-hl)}
.badge.err .dot{background:var(--error)}
.badge.loading .dot{background:var(--gold);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.icon-btn{width:34px;height:34px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--muted);transition:background .15s,color .15s;flex-shrink:0;}
.icon-btn:hover{background:var(--surface-off);color:var(--text)}
#btnRefresh.spin svg{transform:rotate(360deg);transition:transform .6s ease}

/* Modals */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:flex;align-items:center;justify-content:center;padding:1rem;backdrop-filter:blur(6px)}
.overlay.hide{display:none}
.modal{background:var(--surface);border-radius:14px;padding:1.75rem;width:100%;max-width:440px;box-shadow:var(--sh-lg);border:1px solid var(--border);position:relative}
.modal-close{position:absolute;top:15px;left:15px;color:var(--muted);background:var(--surface-off);border-radius:50%;width:30px;height:30px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.2s}
.modal-close:hover{color:var(--text);background:var(--divider)}
.modal h2{font-size:1.2rem;font-weight:700;margin-bottom:.25rem}
.modal .sub{color:var(--muted);font-size:.875rem;margin-bottom:1.5rem}

.tabs{display:flex;gap:6px;margin-bottom:1.5rem;border-bottom:1px solid var(--border);padding-bottom:10px;overflow-x:auto}
.tab-btn{flex:1;padding:8px 4px;font-size:.85rem;font-weight:600;color:var(--muted);text-align:center;border-radius:8px;transition:.2s;white-space:nowrap}
.tab-btn.active{background:var(--primary-hl);color:var(--primary)}
.tab-content{display:none}
.tab-content.active{display:block}

.f-group{margin-bottom:.875rem}
.f-group label{display:block;font-size:.8rem;font-weight:600;color:var(--muted);margin-bottom:.35rem;text-transform:uppercase;letter-spacing:.04em}
.f-group input, .f-group select{width:100%;padding:.7rem .875rem;border:1px solid var(--border);border-radius:8px;background:var(--surface-2);font-size:.95rem;transition:border-color .15s,box-shadow .15s;}
.f-group input:focus, .f-group select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-hl)}
.btn-cta{width:100%;margin-top:1rem;padding:.8rem;background:var(--primary);color:#fff;border-radius:8px;font-size:1rem;font-weight:700;transition:background .15s,transform .1s;}
.btn-cta:hover{background:var(--primary-h)}
.btn-cta:active{transform:scale(.98)}

.main{padding:1.5rem;max-width:1280px;margin:0 auto;width:100%}
@media(max-width:600px){.main{padding:1rem .875rem}}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:.875rem;margin-bottom:1.75rem}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.1rem 1.25rem;box-shadow:var(--sh-sm);transition:box-shadow .15s}
.kpi-lbl{font-size:.75rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:.375rem}
.kpi-val{font-size:1.65rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi-sub{font-size:.75rem;color:var(--muted);margin-top:.3rem}
.c-pos{color:var(--success)}.c-neg{color:var(--error)}.c-pri{color:var(--primary)}.c-gold{color:var(--gold)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:1.125rem;margin-bottom:1.75rem}
@media(max-width:860px){.grid2{grid-template-columns:1fr}}

.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.25rem;box-shadow:var(--sh-sm)}
.card-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem}
.card-title{font-size:.9rem;font-weight:700}
.card-meta{font-size:.75rem;color:var(--muted)}

.b-list{display:flex;flex-direction:column;gap:.7rem}
.b-row-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:.25rem}
.b-cat{font-size:.85rem;font-weight:600;display:flex;align-items:center;gap:6px}
.b-edit-btn{color:var(--muted);background:var(--surface-off);border-radius:4px;padding:2px 5px;font-size:.7rem;cursor:pointer;transition:.2s}
.b-edit-btn:hover{color:var(--text);background:var(--divider)}
.b-amounts{font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
.b-track{height:6px;background:var(--surface-off);border-radius:3px;overflow:hidden}
.b-fill{height:100%;border-radius:3px;transition:width .7s cubic-bezier(.16,1,.3,1)}

.chart-wrap{height:210px;position:relative;margin-top:.25rem}

.list-cont{display:flex;flex-direction:column;gap:.4rem;max-height:320px;overflow-y:auto;padding-right:2px}
.list-cont::-webkit-scrollbar{width:3px}
.list-cont::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.l-item{display:flex;align-items:center;gap:.625rem;padding:.55rem .7rem;border-radius:8px;border:1px solid var(--divider);background:var(--surface-2);transition:background .12s;}
.l-item:hover{background:var(--surface-off)}
.t-cb{width:17px;height:17px;border:1.5px solid var(--border);border-radius:4px;cursor:pointer;transition:.12s}
.t-cb:hover{border-color:var(--primary);background:var(--primary-hl)}
.t-txt{flex:1;font-size:.85rem;line-height:1.45}
.t-q{font-size:.68rem;padding:.12rem .4rem;border-radius:999px;font-weight:600;white-space:nowrap}
.tx-em{font-size:1rem;flex-shrink:0;width:24px;text-align:center}
.tx-info{flex:1;min-width:0}
.tx-desc{font-size:.85rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-meta{font-size:.72rem;color:var(--muted)}
.tx-amt{font-size:.875rem;font-weight:700;font-variant-numeric:tabular-nums}
.tx-amt.p{color:var(--success)}.tx-amt.n{color:var(--error)}
.del-btn{opacity:0;color:var(--faint);transition:.12s;padding:2px}
.l-item:hover .del-btn{opacity:1}
.del-btn:hover{color:var(--error)}

.fab{position:fixed;bottom:2rem;left:2rem;width:56px;height:56px;border-radius:50%;background:var(--primary);color:#fff;font-size:1.8rem;display:flex;align-items:center;justify-content:center;box-shadow:var(--sh-lg);cursor:pointer;transition:transform .2s,background .2s;z-index:90;}
.fab:hover{transform:scale(1.05);background:var(--primary-h)}

.empty{display:flex;flex-direction:column;align-items:center;padding:1.75rem 1rem;color:var(--muted);gap:.5rem;text-align:center}
.empty svg{opacity:.3}
@keyframes sh{0%{background-position:-200% 0}100%{background-position:200% 0}}
.sk{background:linear-gradient(90deg,var(--surface-off) 25%,var(--surface-dyn) 50%,var(--surface-off) 75%);background-size:200% 100%;animation:sh 1.4s ease-in-out infinite;border-radius:6px}
.toasts{position:fixed;bottom:1.25rem;left:50%;transform:translateX(-50%);z-index:999;display:flex;flex-direction:column;gap:.5rem;pointer-events:none;align-items:center}
.toast{background:var(--text);color:var(--bg);padding:.55rem 1.1rem;border-radius:999px;font-size:.83rem;font-weight:600;box-shadow:var(--sh-md);animation:tin .25s ease;pointer-events:auto}
@keyframes tin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.err-banner{background:var(--error-hl);border:1px solid var(--error);border-radius:10px;padding:.875rem 1rem;margin-bottom:1.25rem;font-size:.875rem;display:none;align-items:flex-start;gap:.625rem}
.err-banner.show{display:flex}
.err-banner strong{color:var(--error)}
</style>
</head>
<body>
<header class="hdr">
  <div class="logo"><div class="logo-icon">🤖</div>סחבק</div>
  <div class="spacer"></div>
  <div class="badge" id="badge"><span class="dot"></span><span id="badgeTxt">לא מחובר</span></div>
  <button class="icon-btn" id="btnRefresh" title="רענן" onclick="load()">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
  </button>
  <button class="icon-btn" title="הגדרות" onclick="openCfgModal()">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="3"/><path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72 1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
  </button>
  <button class="icon-btn" title="מצב צבע" onclick="toggleTheme()">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" id="themeIcon"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
  </button>
</header>

<div class="overlay hide" id="cfgModal">
  <div class="modal">
    <button class="modal-close" onclick="closeCfgModal()">✕</button>
    <h2>🔌 הגדרות חיבור</h2>
    <p class="sub">עדכן את פרטי החיבור לבוט</p>
    <div class="f-group"><label>Railway URL</label><input id="cfgUrl" type="text" dir="ltr"></div>
    <div class="f-group"><label>מפתח API</label><input id="cfgKey" type="password"></div>
    <div class="f-group"><label>מספר טלפון (user_id)</label><input id="cfgUser" type="text" dir="ltr"></div>
    <button class="btn-cta" onclick="saveConf()">שמור והתחבר 🚀</button>
  </div>
</div>

<!-- Modal הפלוס המרכזי עם טאב התקציב החדש -->
<div class="overlay hide" id="addModal">
  <div class="modal">
    <button class="modal-close" onclick="closeAddModal()">✕</button>
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('exp')" id="tab-btn-exp">💸 תנועה</button>
      <button class="tab-btn" onclick="switchTab('bud')" id="tab-btn-bud">📊 תקציב</button>
      <button class="tab-btn" onclick="switchTab('rec')" id="tab-btn-rec">🗓️ קבוע</button>
      <button class="tab-btn" onclick="switchTab('tsk')" id="tab-btn-tsk">✅ משימה</button>
    </div>
    
    <div class="tab-content active" id="tab-exp">
      <div class="f-group"><label>קטגוריה</label><select id="eCat"><option value="מזון">🍔 מזון</option><option value="רכב">🚗 רכב</option><option value="דיור">🏠 דיור</option><option value="בריאות">💊 בריאות</option><option value="חינוך">📚 חינוך</option><option value="בילויים">🎉 בילויים</option><option value="קניות">🛒 קניות</option><option value="נופש">✈️ נופש</option><option value="הכנסה">💰 הכנסה</option></select></div>
      <div class="f-group"><label>סכום (₪)</label><input type="number" id="eAmt" placeholder="0"></div>
      <div class="f-group"><label>תיאור</label><input type="text" id="eDesc" placeholder="למשל: סופר"></div>
      <button class="btn-cta" onclick="addExp()">הוסף תנועה</button>
    </div>

    <!-- Budget Tab (החדש והמעוצב) -->
    <div class="tab-content" id="tab-bud">
      <p class="sub" style="margin-bottom: 1rem;">הגדר את יעד ההוצאות או החיסכון החודשי שלך.</p>
      <div class="f-group">
        <label>בחר קטגוריה</label>
        <select id="bCat">
          <option value="מזון">🍔 מזון</option>
          <option value="רכב">🚗 רכב</option>
          <option value="דיור">🏠 דיור</option>
          <option value="בריאות">💊 בריאות</option>
          <option value="חינוך">📚 חינוך</option>
          <option value="בילויים">🎉 בילויים</option>
          <option value="קניות">🛒 קניות</option>
          <option value="נופש">✈️ נופש</option>
          <option value="חיסכון">🐷 חיסכון</option>
        </select>
      </div>
      <div class="f-group">
        <label>יעד חודשי (₪)</label>
        <input type="number" id="bAmt" placeholder="למשל: 1500 (הקלד 0 לביטול היעד)" min="0">
      </div>
      <button class="btn-cta" onclick="saveBudgetLimit()">שמור יעד תקציב</button>
    </div>

    <div class="tab-content" id="tab-rec">
      <div class="f-group"><label>קטגוריה</label><select id="rCat"><option value="בילויים">🎉 בילויים</option><option value="דיור">🏠 דיור</option><option value="רכב">🚗 רכב</option><option value="בריאות">💊 בריאות</option><option value="חינוך">📚 חינוך</option><option value="הכנסה">💰 הכנסה קבועה</option></select></div>
      <div class="f-group"><label>סכום (₪)</label><input type="number" id="rAmt" placeholder="0"></div>
      <div class="f-group"><label>יום חיוב בחודש (1-31)</label><input type="number" id="rDay" placeholder="למשל: 10" min="1" max="31"></div>
      <div class="f-group"><label>תיאור העסק</label><input type="text" id="rDesc" placeholder="למשל: נטפליקס"></div>
      <button class="btn-cta" onclick="addRecurring()">שמור הוראת קבע</button>
    </div>

    <div class="tab-content" id="tab-tsk">
      <div class="f-group"><label>תיאור המשימה</label><input type="text" id="newTDesc"></div>
      <div class="f-group"><label>דחיפות</label><select id="newTQ"><option value="חשוב דחוף">🔴 חשוב דחוף</option><option value="חשוב לא דחוף" selected>🟡 חשוב לא דחוף</option><option value="דחוף לא חשוב">🟠 דחוף לא חשוב</option><option value="לא דחוף לא חשוב">🟢 לא חשוב</option></select></div>
      <button class="btn-cta" onclick="addTask()">הוסף משימה</button>
    </div>
  </div>
</div>

<main class="main" id="main" style="display:none">
  <div class="err-banner" id="errBanner"><span>⚠️</span><div><strong>שגיאת חיבור</strong><br><span id="errMsg"></span></div></div>
  <div class="kpis">
    <div class="kpi"><div class="kpi-lbl">מאזן פנוי</div><div class="kpi-val c-pri" id="kBalance">—</div><div class="kpi-sub" id="kMonth"></div></div>
    <div class="kpi"><div class="kpi-lbl">הוצאות</div><div class="kpi-val c-neg" id="kExp">—</div><div class="kpi-sub">החודש</div></div>
    <div class="kpi"><div class="kpi-lbl">הכנסות</div><div class="kpi-val c-pos" id="kInc">—</div><div class="kpi-sub">החודש</div></div>
    <div class="kpi"><div class="kpi-lbl">משימות פתוחות</div><div class="kpi-val c-gold" id="kTasks">—</div><div class="kpi-sub" id="kTaskSub"></div></div>
  </div>

  <div class="grid2">
    <div class="card">
      <div class="card-hdr"><div class="card-title">📊 תקציב לפי קטגוריה</div><div class="card-meta" id="bMonth"></div></div>
      <div class="b-list" id="bList"><div class="sk" style="height:36px;margin-bottom:.5rem"></div></div>
    </div>
    <div class="card">
      <div class="card-hdr"><div class="card-title">🥧 חלוקת הוצאות</div></div>
      <div class="chart-wrap"><canvas id="pie"></canvas></div>
    </div>
  </div>

  <div class="grid2">
    <div class="card">
      <div class="card-hdr"><div class="card-title">💸 תנועות אחרונות</div><div class="card-meta" id="txCount"></div></div>
      <div class="list-cont" id="txList"><div class="sk" style="height:46px;margin-bottom:.35rem"></div></div>
    </div>
    <div class="card">
      <div class="card-hdr"><div class="card-title">🗓️ מינויים והוראות קבע</div></div>
      <div class="list-cont" id="recList"><div class="empty"><p>בקרוב: מינויים יוצגו כאן!</p></div></div>
    </div>
  </div>
  
  <div class="grid2" style="grid-template-columns: 1fr;">
    <div class="card">
      <div class="card-hdr"><div class="card-title">✅ משימות</div><div class="card-meta" id="tCount"></div></div>
      <div class="list-cont" id="tList"><div class="sk" style="height:42px;margin-bottom:.4rem"></div></div>
    </div>
  </div>
</main>

<button class="fab" onclick="openAddModal()">+</button>
<div class="toasts" id="toasts"></div>

<script>
const _inj = window.__SAHBAK_CFG__ || {};
const _injClean = {};
for (const k in _inj) if (_inj[k] !== '' && _inj[k] != null) _injClean[k] = _inj[k];
let C = Object.assign({ url:'', key:'', userId:'', token:'' }, JSON.parse(localStorage.getItem('sahbak_cfg') || '{}'), _injClean);
(function(){const q = new URLSearchParams(location.search);const uid = q.get('user_id') || q.get('u');const tok = q.get('token') || q.get('t');if(uid) C.userId = uid;if(tok) C.token = tok;})();

const EMO = {דיור:'🏠',רכב:'🚗',נופש:'✈️',מזון:'🍔',בריאות:'💊',חינוך:'📚',בילויים:'🎉',קניות:'🛒',הכנסה:'💰'};
const QC = {'חשוב דחוף':'q1','חשוב לא דחוף':'q2','דחוף לא חשוב':'q3','לא דחוף לא חשוב':'q4'};
let pieChart = null;

function toggleTheme(){const h=document.documentElement;h.setAttribute('data-theme',h.getAttribute('data-theme')==='dark'?'light':'dark');}

function openCfgModal(){document.getElementById('cfgUrl').value=C.url;document.getElementById('cfgKey').value=C.key;document.getElementById('cfgUser').value=C.userId;document.getElementById('cfgModal').classList.remove('hide');}
function closeCfgModal(){document.getElementById('cfgModal').classList.add('hide')}
function openAddModal(){document.getElementById('addModal').classList.remove('hide');}
function closeAddModal(){document.getElementById('addModal').classList.add('hide');}
document.querySelectorAll('.overlay').forEach(el=>el.addEventListener('click',e=>{if(e.target===el)el.classList.add('hide')}));

function switchTab(tab){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));
  document.getElementById('tab-btn-'+tab).classList.add('active');
  document.getElementById('tab-'+tab).classList.add('active');
}

function saveConf(){
  const u=document.getElementById('cfgUrl').value.trim().replace(/\/+$/,''),k=document.getElementById('cfgKey').value.trim(),uid=document.getElementById('cfgUser').value.trim();
  if(!u||!uid){toast('⚠️ מלא לפחות כתובת ומספר');return;}
  C={url:u,key:k,userId:uid,token:C.token||''};
  localStorage.setItem('sahbak_cfg',JSON.stringify(C));
  closeCfgModal();document.getElementById('main').style.display='';load();
}

async function api(path,method='GET',body=null){
  const sep=path.includes('?')?'&':'?';
  const url=C.url+path+(method==='GET'?`${sep}user_id=${encodeURIComponent(C.userId)}`:'');
  const opts={method,headers:{'X-Dashboard-Key':C.key||'','X-Dash-Token':C.token||'','Content-Type':'application/json'}};
  if(body)opts.body=JSON.stringify(body);
  const r=await fetch(url,opts);
  if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error(j.error||r.status);}
  return r.json();
}

async function load(){
  setBadge('loading','מתחבר...');
  const btn=document.getElementById('btnRefresh');btn.classList.add('spin');
  document.getElementById('errBanner').classList.remove('show');
  try{
    const d=await api('/api/dashboard');
    renderKPIs(d); renderBudget(d); renderPie(d); renderTasks(d); renderTx(d);
    setBadge('ok','מחובר ✓'); document.getElementById('main').style.display='';
  }catch(e){
    setBadge('err','שגיאה');document.getElementById('errBanner').classList.add('show');document.getElementById('errMsg').textContent=e.message;toast('❌ '+e.message);
  }finally{setTimeout(()=>btn.classList.remove('spin'),500);}
}

function setBadge(s,t){document.getElementById('badge').className='badge'+(s==='ok'?' ok':s==='err'?' err':s==='loading'?' loading':'');document.getElementById('badgeTxt').textContent=t;}

function renderKPIs(d){
  const txs=d.transactions||[]; let inc=0,exp=0;
  txs.forEach(t=>{t.amount>0?inc+=t.amount:exp+=Math.abs(t.amount)});
  const bal=inc-exp;
  document.getElementById('kBalance').textContent=fmt(bal);
  document.getElementById('kBalance').className='kpi-val '+(bal>=0?'c-pos':'c-neg');
  document.getElementById('kExp').textContent=fmt(exp); document.getElementById('kInc').textContent=fmt(inc);
  document.getElementById('kMonth').textContent=d.month||''; document.getElementById('bMonth').textContent=d.month||'';
  document.getElementById('kTasks').textContent=(d.tasks||[]).length; document.getElementById('kTaskSub').textContent=`הושלמו ${d.tasks_completed||0}/${d.tasks_total||0}`;
  document.getElementById('tCount').textContent=(d.tasks||[]).length+' משימות'; document.getElementById('txCount').textContent=(d.transactions||[]).length+' תנועות';
}

function renderBudget(d){
  const el=document.getElementById('bList');
  const exps=(d.budget_summary||[]).filter(b=>b.category!=='הכנסה'&&b.total<0);
  if(!exps.length){el.innerHTML='<div class="empty"><p>אין הוצאות החודש</p></div>';return;}
  el.innerHTML=exps.map(b=>{
    const sp=Math.abs(b.total),lim=b.limit||(d.budget_limits||{})[b.category]||0;
    const isUnconfigured = (lim === 0);
    const pct=isUnconfigured ? 0 : Math.min(100,sp/lim*100);
    const col=isUnconfigured ? 'var(--surface-off)' : (sp>lim ? 'var(--error)' : (pct>75 ? 'var(--warn)' : 'var(--primary)'));
    const amountStr = isUnconfigured ? `${fmt(sp)} (לא הוגדר יעד)` : `${fmt(sp)} / ${fmt(lim)}`;
    return `<div class="b-row">
      <div class="b-row-top">
        <span class="b-cat">${EMO[b.category]||'💵'} ${b.category} <button class="b-edit-btn" onclick="editBudget('${b.category}')">✏️ ערוך</button></span>
        <span class="b-amounts">${amountStr}</span>
      </div>
      <div class="b-track"><div class="b-fill" style="width:${pct}%;background:${col}"></div></div>
    </div>`;
  }).join('');
}

function renderPie(d){
  const exps=(d.budget_summary||[]).filter(b=>b.category!=='הכנסה'&&b.total<0);
  const ctx=document.getElementById('pie').getContext('2d');
  if(pieChart)pieChart.destroy();
  const dk=document.documentElement.getAttribute('data-theme')==='dark';
  pieChart=new Chart(ctx,{
    type:'doughnut',
    data:{labels:exps.map(b=>`${EMO[b.category]||''} ${b.category}`),datasets:[{data:exps.map(b=>Math.abs(b.total)),backgroundColor:['#4f98a3','#01696f','#6daa45','#e8af34','#bb653b','#d163a7','#5591c7','#a86fdf','#da7101'],borderWidth:2,borderColor:dk?'#1a1917':'#fff'}]},
    options:{responsive:true,maintainAspectRatio:false,cutout:'58%',plugins:{legend:{position:'right',labels:{color:dk?'#d4d3d0':'#28251d',font:{family:'Heebo',size:10},boxWidth:9,usePointStyle:true}},tooltip:{callbacks:{label:c=>`₪${Math.round(c.raw).toLocaleString('he-IL')}`}}}}
  });
}

function renderTasks(d){
  const el=document.getElementById('tList'); const tasks=d.tasks||[];
  if(!tasks.length){el.innerHTML='<div class="empty"><p>אין משימות פתוחות 🎉</p></div>';return;}
  el.innerHTML=tasks.map(t=>`<div class="l-item" id="ti${t.id}"><div class="t-cb" onclick="doneTask(${t.id})"></div><span class="t-txt">${esc(t.description)}</span><span class="t-q ${QC[t.quadrant]||'q2'}">${t.quadrant}</span><button class="del-btn" onclick="delTask(${t.id})"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/></svg></button></div>`).join('');
}

function renderTx(d){
  const el=document.getElementById('txList'); const txs=d.transactions||[];
  if(!txs.length){el.innerHTML='<div class="empty"><p>אין תנועות החודש</p></div>';return;}
  el.innerHTML=txs.map(t=>`<div class="l-item" id="tx${t.id}"><span class="tx-em">${EMO[t.category]||'💵'}</span><div class="tx-info"><div class="tx-desc">${esc(t.description||t.category)}</div><div class="tx-meta">${t.category} · ${t.date}</div></div><span class="tx-amt ${t.amount>0?'p':'n'}">${t.amount>0?'+':''}${fmt(t.amount)}</span><button class="del-btn" onclick="delExp(${t.id})"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>`).join('');
}

async function addTask(){
  const desc=document.getElementById('newTDesc').value.trim(), quad=document.getElementById('newTQ').value;
  if(!desc){toast('⚠️ הכנס תיאור');return;}
  try{await api('/api/tasks','POST',{user_id:C.userId,description:desc,quadrant:quad});document.getElementById('newTDesc').value=''; closeAddModal(); toast('✅ משימה נוספה'); await load();}catch(e){toast('❌ '+e.message);}
}

async function doneTask(id){try{document.getElementById('ti'+id).style.opacity='.35';await api(`/api/tasks/${id}/complete?user_id=${encodeURIComponent(C.userId)}`,'PATCH');toast('🎉 הושלם!');await load();}catch(e){toast('❌ '+e.message);}}
async function delTask(id){try{document.getElementById('ti'+id).style.opacity='.35';await api(`/api/tasks/${id}?user_id=${encodeURIComponent(C.userId)}`,'DELETE');toast('🗑️ נמחק');await load();}catch(e){toast('❌ '+e.message);}}
async function delExp(id){try{document.getElementById('tx'+id).style.opacity='.35';await api(`/api/expense/${id}?user_id=${encodeURIComponent(C.userId)}`,'DELETE');toast('🗑️ נמחק');await load();}catch(e){toast('❌ '+e.message);}}

async function addExp(){
  const cat=document.getElementById('eCat').value, amt=parseFloat(document.getElementById('eAmt').value), desc=document.getElementById('eDesc').value.trim()||cat;
  if(!amt||amt<=0){toast('⚠️ הכנס סכום');return;}
  try{await api('/api/expense','POST',{user_id:C.userId,category:cat,amount:amt,description:desc});document.getElementById('eAmt').value='';document.getElementById('eDesc').value=''; closeAddModal(); toast('✅ נרשם'); await load();}catch(e){toast('❌ '+e.message);}
}

async function addRecurring(){toast('🔄 שומר הוראת קבע (השרת יעודכן בקרוב)...');closeAddModal();}

// הפונקציה החדשה שמקפיצה את המודל המעוצב במקום ה-prompt המיושן
function editBudget(cat){
  switchTab('bud');
  const sel = document.getElementById('bCat');
  if([...sel.options].some(o => o.value === cat)){ sel.value = cat; }
  document.getElementById('bAmt').value = '';
  openAddModal();
}

// הפונקציה ששומרת בפועל למסד הנתונים את התקציב
async function saveBudgetLimit(){
  const cat = document.getElementById('bCat').value;
  const amt = parseFloat(document.getElementById('bAmt').value);
  if(isNaN(amt) || amt < 0){ toast('⚠️ הכנס סכום חוקי'); return; }
  
  toast('⏳ מעדכן...');
  try{
    await api('/api/budget-limits', 'PUT', {[cat]: amt});
    document.getElementById('bAmt').value = '';
    closeAddModal();
    toast(`✅ תקציב ${cat} עודכן!`);
    await load();
  }catch(e){
    toast('❌ ' + e.message);
  }
}

function fmt(n){return(n<0?'-':'')+'₪'+Math.round(Math.abs(n)).toLocaleString('he-IL')}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function toast(msg){const c=document.getElementById('toasts'),t=document.createElement('div');t.className='toast';t.textContent=msg;c.appendChild(t);setTimeout(()=>{t.style.opacity='0';setTimeout(()=>t.remove(),300)},3000);}
setInterval(()=>load(),30000);
document.getElementById('main').style.display='';
if(!C.userId){openCfgModal();}else{load();}
</script>
</body>
</html>
