<!DOCTYPE html>
<html lang="he" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>סחבק — לוח בקרה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root,[data-theme="light"]{
  --bg:#f7f6f2;--surface:#ffffff;--surface-2:#f9f8f5;--surface-off:#f0ede8;--surface-dyn:#e6e3de;
  --border:rgba(40,37,29,.12);--divider:rgba(40,37,29,.07);
  --text:#28251d;--muted:#7a7974;--faint:#bab9b4;
  --primary:#01696f;--primary-h:#0c4e54;--primary-hl:rgba(1,105,111,.12);
  --success:#437a22;--success-hl:rgba(67,122,34,.12);
  --error:#a12c7b;--error-hl:rgba(161,44,123,.12);
  --warn:#964219;--warn-hl:rgba(150,66,25,.12);
  --gold:#d19900;
  --sh-sm:0 1px 3px rgba(40,37,29,.07);--sh-md:0 4px 16px rgba(40,37,29,.1);--sh-lg:0 12px 36px rgba(40,37,29,.14);
}
[data-theme="dark"]{
  --bg:#111110;--surface:#1a1917;--surface-2:#1f1e1c;--surface-off:#252422;--surface-dyn:#2d2b28;
  --border:rgba(255,255,255,.09);--divider:rgba(255,255,255,.05);
  --text:#d4d3d0;--muted:#787775;--faint:#4e4d4b;
  --primary:#4f98a3;--primary-h:#227f8b;--primary-hl:rgba(79,152,163,.15);
  --success:#6daa45;--success-hl:rgba(109,170,69,.12);
  --error:#d163a7;--error-hl:rgba(209,99,167,.12);
  --warn:#bb653b;--warn-hl:rgba(187,101,59,.12);
  --gold:#e8af34;
  --sh-sm:0 1px 3px rgba(0,0,0,.25);--sh-md:0 4px 16px rgba(0,0,0,.35);--sh-lg:0 12px 36px rgba(0,0,0,.45);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased;scroll-behavior:smooth}
body{font-family:'Heebo',sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;font-size:1rem;line-height:1.6}
button{cursor:pointer;border:none;background:none;font:inherit;color:inherit}
input,select{font:inherit;color:var(--text)}

/* ─── Header ─── */
.hdr{
  background:var(--surface);border-bottom:1px solid var(--border);
  padding:.75rem 1.5rem;display:flex;align-items:center;gap:.875rem;
  position:sticky;top:0;z-index:100;box-shadow:var(--sh-sm);
}
.logo{display:flex;align-items:center;gap:.5rem;font-size:1.1rem;font-weight:800;letter-spacing:-.02em}
.logo-icon{width:32px;height:32px;background:var(--primary);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:1rem}
.spacer{flex:1}
.badge{
  display:flex;align-items:center;gap:.375rem;font-size:.78rem;color:var(--muted);
  background:var(--surface-off);padding:.3rem .7rem;border-radius:999px;border:1px solid var(--border);
}
.badge .dot{width:7px;height:7px;border-radius:50%;background:var(--faint);flex-shrink:0;transition:background .3s}
.badge.ok .dot{background:var(--success);box-shadow:0 0 0 2px var(--success-hl)}
.badge.err .dot{background:var(--error)}
.badge.loading .dot{background:var(--gold);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.icon-btn{
  width:34px;height:34px;border-radius:7px;display:flex;align-items:center;justify-content:center;
  color:var(--muted);transition:background .15s,color .15s;flex-shrink:0;
}
.icon-btn:hover{background:var(--surface-off);color:var(--text)}
#btnRefresh svg{transition:transform .6s ease}
#btnRefresh.spin svg{transform:rotate(360deg)}

/* ─── Modal ─── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:center;justify-content:center;padding:1rem;backdrop-filter:blur(6px)}
.overlay.hide{display:none}
.modal{background:var(--surface);border-radius:14px;padding:1.75rem;width:100%;max-width:440px;box-shadow:var(--sh-lg);border:1px solid var(--border)}
.modal h2{font-size:1.2rem;font-weight:700;margin-bottom:.25rem}
.modal .sub{color:var(--muted);font-size:.875rem;margin-bottom:1.5rem}
.f-group{margin-bottom:.875rem}
.f-group label{display:block;font-size:.8rem;font-weight:600;color:var(--muted);margin-bottom:.35rem;text-transform:uppercase;letter-spacing:.04em}
.f-group input{
  width:100%;padding:.6rem .875rem;border:1px solid var(--border);border-radius:8px;
  background:var(--surface-2);font-size:.9rem;
  transition:border-color .15s,box-shadow .15s;
}
.f-group input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-hl)}
.f-group .hint{font-size:.75rem;color:var(--faint);margin-top:.25rem}
.btn-cta{
  width:100%;margin-top:.5rem;padding:.7rem;background:var(--primary);color:#fff;border-radius:8px;
  font-size:.95rem;font-weight:700;transition:background .15s,transform .1s;
}
.btn-cta:hover{background:var(--primary-h)}
.btn-cta:active{transform:scale(.98)}

/* ─── Main ─── */
.main{padding:1.5rem;max-width:1280px;margin:0 auto;width:100%}
@media(max-width:600px){.main{padding:1rem .875rem}}

/* ─── KPIs ─── */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:.875rem;margin-bottom:1.75rem}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.1rem 1.25rem;box-shadow:var(--sh-sm);transition:box-shadow .15s}
.kpi:hover{box-shadow:var(--sh-md)}
.kpi-lbl{font-size:.75rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:.375rem}
.kpi-val{font-size:1.65rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi-sub{font-size:.75rem;color:var(--muted);margin-top:.3rem}
.c-pos{color:var(--success)}.c-neg{color:var(--error)}.c-pri{color:var(--primary)}.c-gold{color:var(--gold)}

/* ─── Grid ─── */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:1.125rem;margin-bottom:1.75rem}
@media(max-width:860px){.grid2{grid-template-columns:1fr}}

/* ─── Card ─── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.25rem;box-shadow:var(--sh-sm)}
.card-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem}
.card-title{font-size:.9rem;font-weight:700}
.card-meta{font-size:.75rem;color:var(--muted)}

/* ─── Budget bars ─── */
.b-list{display:flex;flex-direction:column;gap:.7rem}
.b-row-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:.25rem}
.b-cat{font-size:.85rem;font-weight:500}
.b-amounts{font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
.b-track{height:5px;background:var(--surface-off);border-radius:3px;overflow:hidden}
.b-fill{height:100%;border-radius:3px;transition:width .7s cubic-bezier(.16,1,.3,1)}

/* ─── Chart ─── */
.chart-wrap{height:210px;position:relative;margin-top:.25rem}

/* ─── Tasks ─── */
.t-list{display:flex;flex-direction:column;gap:.4rem;max-height:320px;overflow-y:auto;padding-right:2px}
.t-list::-webkit-scrollbar{width:3px}
.t-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.t-item{
  display:flex;align-items:flex-start;gap:.5rem;padding:.55rem .7rem;
  border-radius:8px;border:1px solid var(--divider);background:var(--surface-2);
  transition:background .12s,opacity .2s;
}
.t-item:hover{background:var(--surface-off)}
.t-cb{
  width:17px;height:17px;border:1.5px solid var(--border);border-radius:4px;
  flex-shrink:0;margin-top:3px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:background .12s,border-color .12s;
}
.t-cb:hover{border-color:var(--primary);background:var(--primary-hl)}
.t-txt{flex:1;font-size:.85rem;line-height:1.45}
.t-q{font-size:.68rem;padding:.12rem .4rem;border-radius:999px;font-weight:600;white-space:nowrap;flex-shrink:0;margin-top:3px}
.q1{background:rgba(192,57,43,.15);color:#e74c3c}.q2{background:rgba(215,189,0,.15);color:var(--gold)}
.q3{background:rgba(230,126,34,.15);color:#e67e22}.q4{background:rgba(67,122,34,.15);color:var(--success)}
[data-theme="light"] .q1{background:#fdecea;color:#c0392b}
[data-theme="light"] .q2{background:#fef9e4;color:#b7770d}
[data-theme="light"] .q3{background:#fdf0de;color:#d35400}
[data-theme="light"] .q4{background:#eafaf1;color:#1e8449}
.t-del{opacity:0;flex-shrink:0;margin-top:2px;color:var(--faint);transition:opacity .12s,color .12s;padding:1px}
.t-item:hover .t-del{opacity:1}
.t-del:hover{color:var(--error)}

/* ─── Add forms ─── */
.add-row{display:flex;gap:.5rem;margin-top:.875rem;flex-wrap:wrap}
.add-row input,.add-row select{
  padding:.5rem .7rem;border:1px solid var(--border);border-radius:7px;
  background:var(--surface-2);font-size:.85rem;transition:border-color .12s;
}
.add-row input{flex:1;min-width:120px}
.add-row select{flex-shrink:0}
.add-row input:focus,.add-row select:focus{outline:none;border-color:var(--primary)}
.btn-add{
  padding:.5rem .875rem;background:var(--primary);color:#fff;border-radius:7px;
  font-size:.85rem;font-weight:700;white-space:nowrap;transition:background .12s;flex-shrink:0;
}
.btn-add:hover{background:var(--primary-h)}

/* ─── Transactions ─── */
.tx-list{display:flex;flex-direction:column;gap:.35rem;max-height:300px;overflow-y:auto;padding-right:2px}
.tx-list::-webkit-scrollbar{width:3px}
.tx-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.tx-item{
  display:flex;align-items:center;gap:.625rem;padding:.55rem .7rem;
  border-radius:8px;border:1px solid var(--divider);background:var(--surface-2);
  transition:background .12s;
}
.tx-item:hover{background:var(--surface-off)}
.tx-em{font-size:1rem;flex-shrink:0;width:24px;text-align:center}
.tx-info{flex:1;min-width:0}
.tx-desc{font-size:.83rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-meta{font-size:.72rem;color:var(--muted)}
.tx-amt{font-size:.875rem;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.tx-amt.p{color:var(--success)}.tx-amt.n{color:var(--error)}
.tx-del{opacity:0;color:var(--faint);transition:opacity .12s,color .12s;flex-shrink:0}
.tx-item:hover .tx-del{opacity:1}
.tx-del:hover{color:var(--error)}

/* ─── Expense add ─── */
.exp-form{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-top:.875rem}
.exp-form select,.exp-form input{
  padding:.5rem .7rem;border:1px solid var(--border);border-radius:7px;
  background:var(--surface-2);font-size:.85rem;width:100%;transition:border-color .12s;
}
.exp-form select:focus,.exp-form input:focus{outline:none;border-color:var(--primary)}
.exp-form .span2{grid-column:1/-1;display:flex;gap:.5rem}
.exp-form .span2 input{flex:1}

/* ─── Empty ─── */
.empty{display:flex;flex-direction:column;align-items:center;padding:1.75rem 1rem;color:var(--muted);gap:.5rem;text-align:center}
.empty svg{opacity:.3}
.empty p{font-size:.83rem}

/* ─── Skeleton ─── */
@keyframes sh{0%{background-position:-200% 0}100%{background-position:200% 0}}
.sk{background:linear-gradient(90deg,var(--surface-off) 25%,var(--surface-dyn) 50%,var(--surface-off) 75%);background-size:200% 100%;animation:sh 1.4s ease-in-out infinite;border-radius:6px}

/* ─── Toast ─── */
.toasts{position:fixed;bottom:1.25rem;left:50%;transform:translateX(-50%);z-index:999;display:flex;flex-direction:column;gap:.5rem;pointer-events:none;align-items:center}
.toast{background:var(--text);color:var(--bg);padding:.55rem 1.1rem;border-radius:999px;font-size:.83rem;font-weight:600;box-shadow:var(--sh-md);white-space:nowrap;pointer-events:auto;animation:tin .25s ease}
@keyframes tin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

/* ─── Error banner ─── */
.err-banner{background:var(--error-hl);border:1px solid var(--error);border-radius:10px;padding:.875rem 1rem;margin-bottom:1.25rem;font-size:.875rem;display:none;align-items:flex-start;gap:.625rem}
.err-banner.show{display:flex}
.err-banner strong{color:var(--error)}

/* ─── Connection test button ─── */
.test-row{display:flex;align-items:center;gap:.5rem;margin-top:.75rem}
.btn-test{padding:.45rem .875rem;border:1px solid var(--border);border-radius:7px;font-size:.8rem;font-weight:600;color:var(--muted);background:var(--surface-2);transition:background .12s,color .12s}
.btn-test:hover{background:var(--surface-off);color:var(--text)}
#testResult{font-size:.78rem;color:var(--muted)}
</style>
</head>
<body>
<!-- Header -->
<header class="hdr">
  <div class="logo">
    <div class="logo-icon">🤖</div>
    סחבק
  </div>
  <div class="spacer"></div>
  <div class="badge" id="badge"><span class="dot"></span><span id="badgeTxt">לא מחובר</span></div>
  <button class="icon-btn" id="btnRefresh" title="רענן" onclick="load()">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
  </button>
  <button class="icon-btn" title="הגדרות" onclick="openModal()">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="3"/><path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72 1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
  </button>
  <button class="icon-btn" title="מצב צבע" onclick="toggleTheme()">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" id="themeIcon"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
  </button>
</header>

<!-- Modal -->
<div class="overlay hide" id="modal">
  <div class="modal">
    <h2>🔌 הגדרות חיבור</h2>
    <p class="sub">עדכן את פרטי החיבור לבוט</p>
    <div class="f-group">
      <label>Railway URL</label>
      <input id="cfgUrl" type="text" dir="ltr" placeholder="https://your-app.up.railway.app">
    </div>
    <div class="f-group">
      <label>מפתח API</label>
      <input id="cfgKey" type="password" placeholder="DASHBOARD_API_KEY">
      <div class="hint">הערך שהגדרת ב-Railway Variables</div>
    </div>
    <div class="f-group">
      <label>מספר טלפון (user_id)</label>
      <input id="cfgUser" type="text" dir="ltr" placeholder="972501234567">
      <div class="hint">מספר ה-WhatsApp ללא + (972...)</div>
    </div>
    <div class="test-row">
      <button class="btn-test" onclick="testConn()">🧪 בדוק חיבור</button>
      <span id="testResult"></span>
    </div>
    <button class="btn-cta" onclick="saveConf()" style="margin-top:1rem">שמור והתחבר 🚀</button>
  </div>
</div>

<!-- Content -->
<main class="main" id="main" style="display:none">
  <!-- Error banner -->
  <div class="err-banner" id="errBanner">
    <span>⚠️</span>
    <div><strong>שגיאת חיבור</strong><br><span id="errMsg"></span></div>
  </div>

  <!-- KPIs -->
  <div class="kpis">
    <div class="kpi"><div class="kpi-lbl">מאזן חודשי</div><div class="kpi-val c-pri" id="kBalance">—</div><div class="kpi-sub" id="kMonth"></div></div>
    <div class="kpi"><div class="kpi-lbl">הוצאות</div><div class="kpi-val c-neg" id="kExp">—</div><div class="kpi-sub">החודש</div></div>
    <div class="kpi"><div class="kpi-lbl">הכנסות</div><div class="kpi-val c-pos" id="kInc">—</div><div class="kpi-sub">החודש</div></div>
    <div class="kpi"><div class="kpi-lbl">משימות פתוחות</div><div class="kpi-val c-gold" id="kTasks">—</div><div class="kpi-sub" id="kTaskSub"></div></div>
  </div>

  <!-- Budget + Pie -->
  <div class="grid2">
    <div class="card">
      <div class="card-hdr"><div class="card-title">📊 תקציב לפי קטגוריה</div><div class="card-meta" id="bMonth"></div></div>
      <div class="b-list" id="bList"><div class="sk" style="height:36px;margin-bottom:.5rem"></div><div class="sk" style="height:36px;margin-bottom:.5rem"></div><div class="sk" style="height:36px"></div></div>
    </div>
    <div class="card">
      <div class="card-hdr"><div class="card-title">🥧 חלוקת הוצאות</div></div>
      <div class="chart-wrap"><canvas id="pie"></canvas></div>
    </div>
  </div>

  <!-- Tasks + Transactions -->
  <div class="grid2">
    <div class="card">
      <div class="card-hdr"><div class="card-title">✅ משימות</div><div class="card-meta" id="tCount"></div></div>
      <div class="t-list" id="tList"><div class="sk" style="height:42px;margin-bottom:.4rem"></div><div class="sk" style="height:42px"></div></div>
      <div class="add-row">
        <input type="text" id="newTDesc" placeholder="משימה חדשה..." onkeydown="if(event.key==='Enter')addTask()">
        <select id="newTQ">
          <option value="חשוב דחוף">🔴 חשוב דחוף</option>
          <option value="חשוב לא דחוף" selected>🟡 חשוב לא דחוף</option>
          <option value="דחוף לא חשוב">🟠 דחוף לא חשוב</option>
          <option value="לא דחוף לא חשוב">🟢 לא חשוב</option>
        </select>
        <button class="btn-add" onclick="addTask()">+ הוסף</button>
      </div>
    </div>
    <div class="card">
      <div class="card-hdr"><div class="card-title">💸 תנועות אחרונות</div><div class="card-meta" id="txCount"></div></div>
      <div class="tx-list" id="txList"><div class="sk" style="height:46px;margin-bottom:.35rem"></div><div class="sk" style="height:46px;margin-bottom:.35rem"></div><div class="sk" style="height:46px"></div></div>
      <div class="exp-form">
        <select id="eCat">
          <option value="מזון">🍔 מזון</option>
          <option value="רכב">🚗 רכב</option>
          <option value="דיור">🏠 דיור</option>
          <option value="בריאות">💊 בריאות</option>
          <option value="חינוך">📚 חינוך</option>
          <option value="בילויים">🎉 בילויים</option>
          <option value="קניות">🛒 קניות</option>
          <option value="נופש">✈️ נופש</option>
          <option value="הכנסה">💰 הכנסה</option>
        </select>
        <input type="number" id="eAmt" placeholder="סכום ₪" min="0">
        <div class="span2">
          <input type="text" id="eDesc" placeholder="תיאור (אופציונלי)" onkeydown="if(event.key==='Enter')addExp()">
          <button class="btn-add" onclick="addExp()">+ הוסף</button>
        </div>
      </div>
    </div>
  </div>
</main>

<div class="toasts" id="toasts"></div>

<script>
// ── Config ──
// When served from /dashboard the server injects window.__SAHBAK_CFG__
// (url='' = same-origin → no CORS; token = per-user scope). A URL query
// (?user_id & token) always wins, so a personal link works even if an old
// config is cached in localStorage. The master key is never injected.
const _inj = window.__SAHBAK_CFG__ || {};
const _injClean = {};
for (const k in _inj) if (_inj[k] !== '' && _inj[k] != null) _injClean[k] = _inj[k];
let C = Object.assign(
  { url:'', key:'', userId:'', token:'' },
  JSON.parse(localStorage.getItem('sahbak_cfg') || '{}'),
  _injClean
);
(function(){
  const q = new URLSearchParams(location.search);
  const uid = q.get('user_id') || q.get('u');
  const tok = q.get('token')   || q.get('t');
  if (uid) C.userId = uid;
  if (tok) C.token  = tok;
})();

const EMO = {דיור:'🏠',רכב:'🚗',נופש:'✈️',מזון:'🍔',בריאות:'💊',חינוך:'📚',בילויים:'🎉',קניות:'🛒',הכנסה:'💰'};
const QC  = {'חשוב דחוף':'q1','חשוב לא דחוף':'q2','דחוף לא חשוב':'q3','לא דחוף לא חשוב':'q4'};
let pieChart = null;

// ── Theme ──
function toggleTheme(){
  const h=document.documentElement,d=h.getAttribute('data-theme')==='dark';
  h.setAttribute('data-theme',d?'light':'dark');
}

// ── Modal ──
function openModal(){
  document.getElementById('cfgUrl').value=C.url;
  document.getElementById('cfgKey').value=C.key;
  document.getElementById('cfgUser').value=C.userId;
  document.getElementById('testResult').textContent='';
  document.getElementById('modal').classList.remove('hide');
}
function closeModal(){document.getElementById('modal').classList.add('hide')}
document.getElementById('modal').addEventListener('click',e=>{if(e.target===document.getElementById('modal'))closeModal()});

function saveConf(){
  const u=document.getElementById('cfgUrl').value.trim().replace(/\/+$/,'');
  const k=document.getElementById('cfgKey').value.trim();
  const uid=document.getElementById('cfgUser').value.trim();
  if(!u||!uid){toast('⚠️ מלא לפחות כתובת ומספר');return;}
  C={url:u,key:k,userId:uid,token:C.token||''};
  try{localStorage.setItem('sahbak_cfg',JSON.stringify(C));}catch(e){}
  closeModal();
  document.getElementById('main').style.display='';
  load();
}

async function testConn(){
  const u=document.getElementById('cfgUrl').value.trim().replace(/\/+$/,'');
  const k=document.getElementById('cfgKey').value.trim();
  const uid=document.getElementById('cfgUser').value.trim();
  const el=document.getElementById('testResult');
  el.textContent='בודק...';
  try{
    const r=await fetch(`${u}/api/dashboard?user_id=${encodeURIComponent(uid)}`,{
      headers:{'X-Dashboard-Key':k,'X-Dash-Token':C.token||''}
    });
    if(r.ok){el.textContent='✅ חיבור תקין!';el.style.color='var(--success)'}
    else{const j=await r.json().catch(()=>({}));el.textContent='❌ '+( j.error||r.status);el.style.color='var(--error)'}
  }catch(e){
    el.textContent='❌ CORS / Network — ראה הערה למטה';
    el.style.color='var(--error)';
  }
}

// ── API ──
async function api(path,method='GET',body=null){
  const sep=path.includes('?')?'&':'?';
  const url=C.url+path+(method==='GET'?`${sep}user_id=${encodeURIComponent(C.userId)}`:'');
  const opts={method,headers:{'X-Dashboard-Key':C.key||'','X-Dash-Token':C.token||'','Content-Type':'application/json'}};
  if(body)opts.body=JSON.stringify(body);
  const r=await fetch(url,opts);
  if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error(j.error||r.status);}
  return r.json();
}

// ── Load ──
async function load(){
  setBadge('loading','מתחבר...');
  const btn=document.getElementById('btnRefresh');
  btn.classList.add('spin');
  hideErr();
  try{
    const d=await api('/api/dashboard');
    render(d);
    setBadge('ok','מחובר ✓');
    document.getElementById('main').style.display='';
  }catch(e){
    setBadge('err','שגיאה');
    showErr(e.message);
    toast('❌ '+e.message);
  }finally{
    setTimeout(()=>btn.classList.remove('spin'),500);
  }
}

function setBadge(s,t){
  const b=document.getElementById('badge');
  b.className='badge'+(s==='ok'?' ok':s==='err'?' err':s==='loading'?' loading':'');
  document.getElementById('badgeTxt').textContent=t;
}
function showErr(m){const b=document.getElementById('errBanner');b.classList.add('show');document.getElementById('errMsg').textContent=m;}
function hideErr(){document.getElementById('errBanner').classList.remove('show')}

// ── Render ──
function render(d){
  renderKPIs(d);
  renderBudget(d);
  renderPie(d);
  renderTasks(d);
  renderTx(d);
}

function renderKPIs(d){
  const txs=d.transactions||[];
  let inc=0,exp=0;
  txs.forEach(t=>{t.amount>0?inc+=t.amount:exp+=Math.abs(t.amount)});
  const bal=inc-exp;
  set('kBalance',fmt(bal));
  document.getElementById('kBalance').className='kpi-val '+(bal>=0?'c-pos':'c-neg');
  set('kExp',fmt(exp));set('kInc',fmt(inc));
  set('kMonth',d.month||'');set('bMonth',d.month||'');
  set('kTasks',(d.tasks||[]).length);
  set('kTaskSub',`הושלמו ${d.tasks_completed||0}/${d.tasks_total||0}`);
  set('tCount',(d.tasks||[]).length+' משימות');
  set('txCount',(d.transactions||[]).length+' תנועות');
}

function renderBudget(d){
  const el=document.getElementById('bList');
  const exps=(d.budget_summary||[]).filter(b=>b.category!=='הכנסה'&&b.total<0);
  if(!exps.length){el.innerHTML='<div class="empty"><p>אין הוצאות החודש</p></div>';return;}
  el.innerHTML=exps.map(b=>{
    const sp=Math.abs(b.total),lim=b.limit||(d.budget_limits||{})[b.category]||0;
    const pct=lim>0?Math.min(100,sp/lim*100):0;
    const over=lim>0&&sp>lim;
    const col=over?'var(--error)':pct>75?'var(--warn)':'var(--primary)';
    return `<div class="b-row">
      <div class="b-row-top">
        <span class="b-cat">${EMO[b.category]||'💵'} ${b.category}</span>
        <span class="b-amounts">${fmt(sp)}${lim?' / '+fmt(lim):''}</span>
      </div>
      <div class="b-track"><div class="b-fill" style="width:${pct}%;background:${col}"></div></div>
    </div>`;
  }).join('');
}

function renderPie(d){
  const exps=(d.budget_summary||[]).filter(b=>b.category!=='הכנסה'&&b.total<0);
  const labels=exps.map(b=>`${EMO[b.category]||''} ${b.category}`);
  const vals=exps.map(b=>Math.abs(b.total));
  const colors=['#4f98a3','#01696f','#6daa45','#e8af34','#bb653b','#d163a7','#5591c7','#a86fdf','#da7101'];
  const ctx=document.getElementById('pie').getContext('2d');
  if(pieChart)pieChart.destroy();
  const dk=document.documentElement.getAttribute('data-theme')==='dark';
  pieChart=new Chart(ctx,{
    type:'doughnut',
    data:{labels,datasets:[{data:vals,backgroundColor:colors,borderWidth:2,borderColor:dk?'#1a1917':'#fff'}]},
    options:{
      responsive:true,maintainAspectRatio:false,cutout:'58%',
      plugins:{
        legend:{position:'right',labels:{color:dk?'#d4d3d0':'#28251d',font:{family:'Heebo',size:10},boxWidth:9,padding:6,usePointStyle:true}},
        tooltip:{callbacks:{label:c=>`₪${Math.round(c.raw).toLocaleString('he-IL')}`}}
      }
    }
  });
}

function renderTasks(d){
  const el=document.getElementById('tList');
  const tasks=d.tasks||[];
  if(!tasks.length){
    el.innerHTML='<div class="empty"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg><p>אין משימות פתוחות 🎉</p></div>';
    return;
  }
  el.innerHTML=tasks.map(t=>`
    <div class="t-item" id="ti${t.id}">
      <div class="t-cb" onclick="doneTask(${t.id})" title="סמן כהושלם"></div>
      <span class="t-txt">${esc(t.description)}</span>
      <span class="t-q ${QC[t.quadrant]||'q2'}">${t.quadrant}</span>
      <button class="t-del" onclick="delTask(${t.id})" title="מחק">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/></svg>
      </button>
    </div>`).join('');
}

function renderTx(d){
  const el=document.getElementById('txList');
  const txs=d.transactions||[];
  if(!txs.length){el.innerHTML='<div class="empty"><p>אין תנועות החודש</p></div>';return;}
  el.innerHTML=txs.map(t=>`
    <div class="tx-item" id="tx${t.id}">
      <span class="tx-em">${EMO[t.category]||'💵'}</span>
      <div class="tx-info">
        <div class="tx-desc">${esc(t.description||t.category)}</div>
        <div class="tx-meta">${t.category} · ${t.date}</div>
      </div>
      <span class="tx-amt ${t.amount>0?'p':'n'}">${t.amount>0?'+':''}${fmt(t.amount)}</span>
      <button class="tx-del" onclick="delExp(${t.id})" title="מחק">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>`).join('');
}

// ── Actions ──
async function addTask(){
  const desc=document.getElementById('newTDesc').value.trim();
  const quad=document.getElementById('newTQ').value;
  if(!desc){toast('⚠️ הכנס תיאור');return;}
  try{
    await api('/api/tasks','POST',{user_id:C.userId,description:desc,quadrant:quad});
    document.getElementById('newTDesc').value='';
    toast('✅ משימה נוספה');await load();
  }catch(e){toast('❌ '+e.message);}
}

async function doneTask(id){
  fade('ti'+id);
  try{
    await api(`/api/tasks/${id}/complete?user_id=${enc(C.userId)}`,'PATCH');
    toast('🎉 הושלם!');await load();
  }catch(e){unfade('ti'+id);toast('❌ '+e.message);}
}

async function delTask(id){
  fade('ti'+id);
  try{
    await api(`/api/tasks/${id}?user_id=${enc(C.userId)}`,'DELETE');
    toast('🗑️ נמחק');await load();
  }catch(e){unfade('ti'+id);toast('❌ '+e.message);}
}

async function addExp(){
  const cat=document.getElementById('eCat').value;
  const amt=parseFloat(document.getElementById('eAmt').value);
  const desc=document.getElementById('eDesc').value.trim()||cat;
  if(!amt||amt<=0){toast('⚠️ הכנס סכום');return;}
  try{
    await api('/api/expense','POST',{user_id:C.userId,category:cat,amount:amt,description:desc});
    document.getElementById('eAmt').value='';document.getElementById('eDesc').value='';
    toast('✅ נרשם');await load();
  }catch(e){toast('❌ '+e.message);}
}

async function delExp(id){
  fade('tx'+id);
  try{
    await api(`/api/expense/${id}?user_id=${enc(C.userId)}`,'DELETE');
    toast('🗑️ נמחק');await load();
  }catch(e){unfade('tx'+id);toast('❌ '+e.message);}
}

// ── Helpers ──
function fmt(n){const a=Math.abs(n);return(n<0?'-':'')+'₪'+Math.round(a).toLocaleString('he-IL')}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function enc(s){return encodeURIComponent(s)}
function set(id,v){const e=document.getElementById(id);if(e)e.textContent=v}
function fade(id){const e=document.getElementById(id);if(e)e.style.opacity='.35'}
function unfade(id){const e=document.getElementById(id);if(e)e.style.opacity='1'}
function toast(msg,dur=3200){
  const c=document.getElementById('toasts'),t=document.createElement('div');
  t.className='toast';t.textContent=msg;c.appendChild(t);
  setTimeout(()=>{t.style.transition='opacity .3s';t.style.opacity='0';setTimeout(()=>t.remove(),300)},dur);
}

// ── Auto-refresh every 30s ──
setInterval(()=>load(),30000);

// ── Boot ──
document.getElementById('main').style.display='';
if(!C.userId){ openModal(); } else { load(); }
</script>
</body>
</html>
